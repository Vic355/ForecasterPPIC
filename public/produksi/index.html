<!DOCTYPE html>
<html lang="id" data-theme="sepia">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perencanaan Produksi · PPIC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&family=Source+Sans+3:wght@400;600;700&family=Source+Code+Pro:wght@400;500&display=swap">
<style>
:root { --font: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "Source Code Pro", ui-monospace, Menlo, Consolas, monospace; --serif: Literata, Georgia, serif; --W: 34px; --RH: 34px; --LW: 150px; }
html[data-theme=sepia]{--bg:#efe9dc;--paper:#fcf8ef;--panel2:#f5efe2;--ink:#2b2a26;--mut:#6a665c;--line:#dcd3c0;--line2:#e9e2d2;--acc:#3f6b56;--acc2:#e3ece3;--bad:#b23a2a;--badbg:#f7e0d8;--warn:#865a00;--warnbg:#f8ecd0;--mid:#c48e1c;--ok:#2e7a4b;--okbg:#e0efe2;--blu:#2d5f9a;--blubg:#e4ebf3;--th:#f2ecdf;--grp:#f6f1e6;--hover:#f3eddf;--offb:#e6dfcf;--input:#fffdf7;--shadow:rgba(80,60,20,.12);--hot:#c8452f}
html[data-theme=light]{--bg:#eef0f2;--paper:#ffffff;--panel2:#f5f6f7;--ink:#1d222a;--mut:#5c6470;--line:#d5d9de;--line2:#e7e9ec;--acc:#1f6b5c;--acc2:#e1f0ec;--bad:#b3261e;--badbg:#fbe5e2;--warn:#8a5a00;--warnbg:#fdf0d6;--mid:#c88a12;--ok:#1e7a44;--okbg:#e1f3e8;--blu:#1f5fbf;--blubg:#e6eefb;--th:#f1f3f5;--grp:#f6f7f8;--hover:#f3f5f7;--offb:#e4e7ea;--input:#fff;--shadow:rgba(20,30,40,.10);--hot:#c8452f}
html[data-theme=dark]{--bg:#1b2026;--paper:#232a32;--panel2:#29303a;--ink:#e4dfd3;--mut:#a3aab4;--line:#38404b;--line2:#2d343e;--acc:#e3a55e;--acc2:#3d3223;--bad:#ff8272;--badbg:#3d201c;--warn:#f0b75a;--warnbg:#382c17;--mid:#e0a63a;--ok:#66d293;--okbg:#17322a;--blu:#86b4ff;--blubg:#1a2740;--th:#272e37;--grp:#262c34;--hover:#28303a;--offb:#161a1f;--input:#151a1f;--shadow:rgba(0,0,0,.35);--hot:#ff8a6a;color-scheme:dark}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.4; }
button, select, input, textarea { font: inherit; color: inherit; }
button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); cursor: pointer; font-weight: 600; min-height: 32px; }
button:hover { background: var(--hover); }
button.pri { background: var(--acc); border-color: var(--acc); color: #fff; }
html[data-theme=dark] button.pri { color: #1b1206; }
button.pri:hover { filter: brightness(1.08); }
button.ghost { border-color: transparent; background: transparent; }
button.sm { min-height: 27px; padding: 2px 9px; font-size: 13px; }
button:disabled { opacity: .5; cursor: default; }
select, input[type=text], input[type=number], input[type=search], input[type=date], textarea { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--input); min-height: 30px; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.mut { color: var(--mut); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.pos { color: var(--ok); } .neg { color: var(--bad); }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0; }
.top { display: flex; align-items: center; gap: 14px; padding: 10px 18px; background: var(--paper); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 40; }
.brand { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
.brand h1 { font-size: 21px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 700; background: var(--th); color: var(--mut); white-space: nowrap; }
.chip.ok { background: var(--okbg); color: var(--ok); } .chip.warn { background: var(--warnbg); color: var(--warn); } .chip.bad { background: var(--badbg); color: var(--bad); } .chip.blu { background: var(--blubg); color: var(--blu); } .chip.acc { background: var(--acc2); color: var(--acc); } .chip.hot { background: var(--hot); color: #fff; }
.ask { flex: 1; max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 4px 10px; background: var(--input); color: var(--mut); cursor: text; }
.ask kbd { margin-left: auto; font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
.switch { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.switch a, .switch span { padding: 6px 12px; font-weight: 600; text-decoration: none; color: var(--mut); white-space: nowrap; }
.switch span { background: var(--acc2); color: var(--acc); }
.switch a:hover { background: var(--hover); }
/* stepper */
.stepper { display: flex; background: var(--paper); border-bottom: 1px solid var(--line); padding: 0 12px; overflow-x: auto; }
.st { flex: 1; min-width: 170px; display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 0; border-radius: 10px 10px 0 0; background: none; text-align: left; font-weight: 400; min-height: 0; position: relative; }
.st + .st::before { content: ""; position: absolute; left: -14px; top: 50%; width: 22px; border-top: 1px solid var(--line); }
.st .n { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line); font-weight: 700; color: var(--mut); background: var(--paper); font-family: var(--serif); }
.st b { display: block; font-size: 15px; }
.st small { color: var(--mut); font-size: 12px; }
.st.on { background: var(--acc2); box-shadow: inset 0 -3px 0 var(--acc); }
.st.on .n { background: var(--acc); border-color: var(--acc); color: #fff; }
.st.done .n { border-color: var(--ok); color: var(--ok); }
.st.warn .n { border-color: var(--mid); color: var(--warn); }
/* layout */
.layout { display: grid; grid-template-columns: 310px minmax(0, 1fr); min-height: calc(100vh - 120px); }
aside.side > * { flex: none; }
aside.side { border-right: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 12px; background: var(--panel2); position: sticky; top: 55px; align-self: start; max-height: calc(100vh - 55px); overflow: auto; }
main { padding: 16px 20px 60px; min-width: 0; }
.who { display: flex; align-items: center; gap: 10px; }
.who h2 { font-size: 18px; }
.speech { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 64px; position: relative; font-size: 14px; }
.speech::before { content: ""; position: absolute; left: 18px; top: -7px; width: 12px; height: 12px; background: var(--paper); border-left: 1px solid var(--line); border-top: 1px solid var(--line); transform: rotate(45deg); }
.speech .caret { display: inline-block; width: 7px; height: 14px; background: var(--acc); vertical-align: -2px; margin-left: 2px; animation: blink .8s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.stabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.stabs button.on { background: var(--acc2); border-color: var(--acc); color: var(--acc); }
.alert { border: 1px solid var(--line); border-left: 4px solid var(--c, var(--blu)); background: var(--paper); border-radius: 10px; padding: 9px 11px; }
.alert.red { --c: var(--bad); background: var(--badbg); } .alert.amb { --c: var(--mid); background: var(--warnbg); } .alert.grn { --c: var(--ok); }
.alert .k { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--c); }
.alert .t { font-weight: 700; margin: 2px 0; }
.alert .d { font-size: 13px; color: var(--mut); }
.alert .acts { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
.sk { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--mut); font-weight: 700; }
.chat { display: flex; flex-direction: column; gap: 8px; }
.msg { padding: 8px 10px; border-radius: 10px; background: var(--paper); border: 1px solid var(--line); font-size: 13.5px; }
.msg.me { background: var(--acc2); border-color: transparent; align-self: flex-end; max-width: 90%; }
.sugg { display: flex; flex-wrap: wrap; gap: 6px; }
.sugg button { min-height: 26px; padding: 2px 9px; font-size: 12.5px; border-radius: 999px; }
.lens { display: block; flex: none; overflow: visible; }
.lens .ring { fill: var(--paper); stroke: var(--acc); stroke-width: 2.5; }
.lens .blade { fill: var(--acc); stroke: var(--paper); stroke-width: 1.2; }
.lens .pupil { fill: var(--ink); }
.lens .blades { transform-origin: 30px 30px; }
.lens.talk .blades { animation: talk .5s ease-in-out infinite; }
@keyframes talk { 0%, 100% { transform: rotate(0) scale(1); } 45% { transform: rotate(28deg) scale(.8); } }
@media (prefers-reduced-motion: reduce) { .lens.talk .blades { animation: none; } }
.phead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.phead h2 { font-size: 22px; }
.phead .sp { flex: 1; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
.card h3 { font-size: 16px; margin-bottom: 6px; }
.card .hd { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
.card .hd h3 { margin: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 12px; align-items: start; }
.banner { display: flex; gap: 12px; align-items: center; border: 1px solid var(--blu); background: var(--blubg); border-left-width: 5px; border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; flex-wrap: wrap; }
.banner.amb { border-color: var(--mid); background: var(--warnbg); } .banner.grn { border-color: var(--ok); background: var(--okbg); }
.banner .t { flex: 1; min-width: 240px; }
.rib { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; padding: 3px 8px; border-radius: 5px; background: var(--blu); color: #fff; white-space: nowrap; }
.banner.amb .rib { background: var(--mid); color: #1d1606; } .banner.grn .rib { background: var(--ok); }
.toolbar { display: flex; gap: 8px 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.toolbar label { display: flex; gap: 6px; align-items: center; color: var(--mut); }
.toolbar .sp { flex: 1; }
.nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; border-right: 1px solid var(--line); background: var(--paper); min-height: 30px; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--acc); color: #fff; }
html[data-theme=dark] .seg button.on { color: #1b1206; }
.tbox { overflow: auto; border: 1px solid var(--line2); border-radius: 10px; max-height: 60vh; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 5px 9px; border-bottom: 1px solid var(--line2); text-align: left; white-space: nowrap; background: var(--paper); vertical-align: middle; }
th { background: var(--th); font-size: 12.5px; color: var(--mut); font-weight: 700; position: sticky; top: 0; z-index: 2; }
th.num, td.num { text-align: right; }
td.desc { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
tr.tot td { font-weight: 700; background: var(--th); position: sticky; bottom: 0; z-index: 1; }
tr.hit td { background: var(--badbg); } tr.flag td { background: var(--warnbg); }
td.act { background: color-mix(in srgb, var(--mut) 10%, var(--paper)); color: var(--mut); }
th.act { background: color-mix(in srgb, var(--mut) 18%, var(--th)); }
input.cell { width: 80px; text-align: right; padding: 3px 6px; min-height: 28px; font-variant-numeric: tabular-nums; }
input.cell.fix { border-color: var(--mid); background: var(--warnbg); font-weight: 700; }
.st2 { font-weight: 700; font-size: 12.5px; } .st2.ok { color: var(--ok); } .st2.lo { color: var(--warn); } .st2.bad { color: var(--bad); } .st2.na { color: var(--mut); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 12px; }
.tile { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 9px 13px; }
.tile .k { color: var(--mut); font-size: 13px; font-weight: 600; }
.tile .v { font-size: 22px; font-weight: 700; margin-top: 1px; font-variant-numeric: tabular-nums; }
.tile .s { color: var(--mut); font-size: 12.5px; }
.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 12px; text-align: center; color: var(--mut); cursor: pointer; display: block; }
.drop:hover { border-color: var(--acc); }
.drop b { color: var(--ink); display: block; }
ul.vers { list-style: none; margin: 8px 0 0; padding: 0; }
ul.vers li { display: grid; grid-template-columns: 74px 1fr auto; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line2); align-items: baseline; font-size: 13.5px; }
ul.vers li.cur b { color: var(--acc); }
.flowmini { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--mut); }
.flowmini span { background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; color: var(--ink); font-weight: 600; }
.flowmini span.cur { background: var(--acc); color: #fff; border-color: var(--acc); }
html[data-theme=dark] .flowmini span.cur { color: #1b1206; }
/* popover */
.pop { position: fixed; z-index: 80; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 14px 30px var(--shadow); padding: 12px 14px; width: 340px; }
.pop h3 { font-size: 15px; margin-bottom: 2px; }
.pop dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 8px 0; font-size: 13px; }
.pop dt { color: var(--mut); } .pop dd { margin: 0; font-variant-numeric: tabular-nums; }
.pop .acts { display: flex; flex-wrap: wrap; gap: 6px; }
#setPop { top: 56px; right: 16px; width: 330px; }
#setPop label { display: flex; gap: 9px; align-items: flex-start; padding: 6px 0; }
#setPop label small { display: block; color: var(--mut); }
/* revisions + scenarios */
.sug { border: 1px solid var(--line); border-left: 4px solid var(--c, var(--acc)); border-radius: 10px; padding: 9px 12px; margin-bottom: 8px; background: var(--paper); }
.sug.red { --c: var(--bad); } .sug.amb { --c: var(--mid); }
.sug .t { font-weight: 700; } .sug .d { font-size: 13px; color: var(--mut); margin: 2px 0 6px; }
.sug .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.sug.applied { opacity: .6; }
.opt { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 10px; background: var(--panel2); }
.opt.best { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc); }
.opt .t { font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.opt ul { margin: 6px 0 8px; padding-left: 18px; font-size: 13px; }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
.form label { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--mut); font-weight: 600; }
.form .full { grid-column: 1 / -1; }
.heat { display: inline-block; width: 46px; height: 8px; border-radius: 4px; background: var(--line2); overflow: hidden; vertical-align: middle; margin-right: 6px; }
.heat i { display: block; height: 100%; background: var(--hot); }
table.src td { white-space: normal; vertical-align: top; }
pre.rep { white-space: pre-wrap; font-family: var(--mono); font-size: 12.5px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 10px; padding: 12px; margin: 0; max-height: 360px; overflow: auto; }
textarea.paste { width: 100%; min-height: 150px; font-family: var(--mono); font-size: 12.5px; resize: vertical; }
/* spotlight */
#spot { position: fixed; z-index: 90; border-radius: 8px; box-shadow: 0 0 0 200vmax rgba(25,20,10,.5); pointer-events: none; transition: all .45s cubic-bezier(.3,.7,.2,1); outline: 3px solid var(--mid); outline-offset: 2px; }
#spotEye { position: fixed; z-index: 91; pointer-events: none; transition: left .6s cubic-bezier(.3,.7,.2,1), top .6s cubic-bezier(.3,.7,.2,1); }
#spotTip { position: fixed; z-index: 92; max-width: 320px; background: var(--ink); color: var(--paper); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; box-shadow: 0 10px 26px rgba(0,0,0,.25); }
#spotTip button { margin-top: 6px; min-height: 26px; padding: 2px 10px; font-size: 12.5px; background: transparent; color: inherit; border-color: currentColor; }
#toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 10px; z-index: 95; font-size: 13.5px; max-width: 90vw; }
@media (max-width: 1150px) { .grid3, .grid2 { grid-template-columns: 1fr; } }
@media (max-width: 900px) { .top { flex-wrap: wrap; } .layout { grid-template-columns: 1fr; } aside.side { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); } .ask { display: none; } }
/* plan grid (Excel-like) */
.gwrap { overflow: auto; border: 1px solid var(--line); border-radius: 12px; max-height: 66vh; background: var(--paper); position: relative; }
table.pg { border-collapse: separate; border-spacing: 0; width: max-content; font-size: 12.5px; }
.pg th, .pg td { padding: 0 4px; height: 26px; border-bottom: 1px solid var(--line2); border-right: 1px solid var(--line2); white-space: nowrap; background: var(--paper); }
.pg thead th { position: sticky; top: 0; z-index: 4; background: var(--th); color: var(--mut); font-weight: 700; font-size: 11.5px; height: 34px; line-height: 1.1; text-align: center; }
.pg thead th b { display: block; color: var(--ink); font-size: 12.5px; }
.pg .f0 { position: sticky; left: 0; z-index: 3; width: 250px; min-width: 250px; max-width: 250px; overflow: hidden; text-overflow: ellipsis; }
.pg .f1 { position: sticky; left: 250px; z-index: 3; width: 72px; min-width: 72px; text-align: right; }
.pg .f2 { position: sticky; left: 322px; z-index: 3; width: 72px; min-width: 72px; text-align: right; }
.pg .f3 { position: sticky; left: 394px; z-index: 3; width: 72px; min-width: 72px; text-align: right; }
.pg .f4 { position: sticky; left: 466px; z-index: 3; width: 74px; min-width: 74px; text-align: right; border-right: 2px solid var(--line); }
.pg thead .f0, .pg thead .f1, .pg thead .f2, .pg thead .f3, .pg thead .f4 { z-index: 6; }
.pg td.c { width: 42px; min-width: 42px; max-width: 42px; text-align: right; font-variant-numeric: tabular-nums; cursor: cell; }
.pg th.sun, .pg td.sun { background: var(--offb); }
.pg th.lock { background: color-mix(in srgb, var(--mut) 16%, var(--th)); }
.pg th.today { background: var(--acc); color: #fff; } .pg th.today b { color: #fff; }
.pg th.nm, .pg td.nm { opacity: .6; }
.pg td.p { background: color-mix(in srgb, var(--s1, #2d6aa8) 15%, var(--paper)); color: var(--ink); }
.pg td.p.sun { background: color-mix(in srgb, var(--mid) 30%, var(--paper)); }
.pg td.a { color: var(--mut); background: color-mix(in srgb, var(--mut) 7%, var(--paper)); cursor: default; }
.pg td.a.ok { color: var(--ok); background: var(--okbg); } .pg td.a.lo { color: var(--warn); background: var(--warnbg); } .pg td.a.bad { color: var(--bad); background: var(--badbg); }
.pg td.sel { outline: 2px solid var(--acc); outline-offset: -2px; }
.pg tr.mh td { background: var(--grp); height: 24px; font-weight: 700; color: var(--mut); font-size: 12px; }
.pg tr.mh td.f0 { color: var(--ink); }
.pg tr.mh td.ov { background: var(--badbg); color: var(--bad); text-align: center; }
.pg tr.mh td.free { background: repeating-linear-gradient(135deg, transparent 0 4px, color-mix(in srgb, var(--ok) 18%, transparent) 4px 6px), var(--grp); }
.pg tr.skr td.f0 { cursor: pointer; padding-left: 14px; }
.pg tr.skr td.f0:hover { color: var(--acc); text-decoration: underline; }
.pg tr.skr td.f0 .mat { font-family: var(--mono); font-size: 11px; color: var(--mut); margin-right: 5px; }
.pg tr.add td { height: 24px; }
.pg tr.add td.f0 { padding-left: 14px; }
.pg tr.add button { min-height: 20px; padding: 0 8px; font-size: 12px; border-style: dashed; color: var(--mut); }
.pg td.tg { cursor: text; }
.pg td.tg.ed { font-weight: 700; color: var(--warn); }
.pg td.neg { color: var(--bad); font-weight: 700; } .pg td.pos { color: var(--warn); font-weight: 700; } .pg td.okk { color: var(--ok); }
.pg tr.hl td { box-shadow: inset 0 2px 0 var(--mid), inset 0 -2px 0 var(--mid); }
.pg td.chg-new { background: var(--okbg) !important; color: var(--ok); font-weight: 700; }
.pg td.chg-del { background: var(--badbg) !important; color: var(--bad); text-decoration: line-through; }
.pg td.chg-mod { background: var(--warnbg) !important; color: var(--warn); font-weight: 700; }

<script>
var LS_KEY = 'ppic_prod';

function main(PLAN, STORE) {

  function enumerate(a, b) { var o = [], d = dt(a), e = dt(b); while (d <= e) { o.push(d.toISOString().slice(0, 10)); d.setUTCDate(d.getUTCDate() + 1); } return o; }

  var MONTH_END = PLAN.end, DAYS = enumerate(PLAN.start, addDays(PLAN.end, 6)), DI = {}; DAYS.forEach(function (d, i) { DI[d] = i; });
  var OFF = {}; if (PLAN.offDays && PLAN.offDays.length) { PLAN.offDays.forEach(function (d) { OFF[d] = 1; }); DAYS.forEach(function (d) { if (d > PLAN.end && dt(d).getUTCDay() === 0) OFF[d] = 1; }); } else DAYS.forEach(function (d) { if (dt(d).getUTCDay() === 0) OFF[d] = 1; });

  function jenisOf(cat) { var c = String(cat || '').toUpperCase(); for (var i = 0; i < JENIS.length; i++) if (JENIS[i][1].test(c)) return JENIS[i][0]; return cat ? String(cat) : 'Lainnya'; }
  function lineTgt(l) { if (l.tgt != null) return +l.tgt; if (l.ct) return +l.ct; var t = 0; for (var k in l.plan) t += l.plan[k]; return t; }

  var MACH = {}, MLIST = [];

  var JN = JENIS.map(function (j) { return j[0]; }); MLIST.forEach(function (m) { if (JN.indexOf(MACH[m].jenis) < 0) JN.push(MACH[m].jenis); });

  JN = JN.filter(function (j) { return MLIST.some(function (m) { return MACH[m].jenis === j; }); });
  var COL = { 'Facial box': '#7a5aa6', 'Kiloan': '#a0662e', 'Travel pack': '#2d6aa8', 'Softpack besar': '#3f7a5e', 'Pop up & interfold': '#b0573a', 'Softpack': '#56709a' };

    if (DEMO) { var hot = HOTS[s.mat]; fcDay = s.pp / 25 * (0.9 + h * 0.3); cover = hot ? hot[0] : 5 + h * 22; trend = hot ? hot[1] : Math.round((hash(s.mat + 't') - 0.55) * 40); under = hot ? hot[2] : Math.round(hash(s.mat + 'u') * 3.4); rush = hot ? hot[3] : (hash(s.mat + 'r') > 0.86 ? 1 : 0); cl = hot ? hot[4] : (['A', 'B', 'C'][Math.floor(hash(s.mat + 'c') * 2.6)] + ['X', 'Y', 'Z'][Math.floor(hash(s.mat + 'x') * 2.7)]); }

    s.sig = { fcDay: fcDay, cover: cover, trend: trend, under: under, rush: rush, cls: cl };

  function capable(mat, m) { return !!MACH[m] && SKU[mat].jenis === MACH[m].jenis; }
  var HOTTEST = SLIST.slice().sort(function (a, b) { return b.score - a.score; })[0] || SLIST[0];
  function capMachines(mat) { return MLIST.filter(function (m) { return capable(mat, m); }); }

  var S = { step: 2, mode: 'rencana', L: null, rows: [], act: {}, opt: { talk: true, focus: true }, filter: null, hist: [], scen: 'rush', rush: { mat: HOTTEST ? HOTTEST.mat : '', qty: 0, due: '' }, stop: { m: MLIST[0], from: '', days: 2 }, options: null, optSel: 0, pasteDay: '', pasteText: '', pasteRes: null, fixes: {}, jf: '', sel: null, hl: {} };

        return { id: id, machine: r.machine || '-', material: r.material, desc: r.desc, category: r.category || r.machine || '', net: r.net, target: r.target || mx, ct: ct, tgt: r.qty > 0 ? r.qty : ct, plan: plan };
      });
      if (!lines.length) { upStat(file.name + ': tidak ada baris dengan angka rencana.', 1); return; }
      var offs = enumerate(start, end).filter(function (d) { return dt(d).getUTCDay() === 0; });
      var p = { period: month, label: new Date(month + '-01T00:00:00').toLocaleDateString('id-ID', { month: 'long', year: 'numeric' }), start: start, end: end, offDays: offs, source: file.name + ' · lembar "' + best.n + '"' + (ds.length ? '' : ' (daftar PP)'), loadedAt: new Date().toISOString(), lines: lines, L: L };
      if (!DEMO && S.L && !confirm('Ganti rencana dan aktual di browser ini dengan isi ' + file.name + '?')) { upStat('Dibatalkan.'); return; }
      saveStoreAndReload({ plan: p, actual: act });
    }).catch(function (e) { upStat('Gagal membaca ' + file.name + ': ' + (e.message || e), 1); });
  }
  window.addEventListener('storage', function (e) { if (e.key === LS_KEY && !DEMO && e.newValue) { try { var o = JSON.parse(e.newValue); if (o && o.plan && o.plan.loadedAt !== PLAN.loadedAt) { toast('Rencana baru dari Forecast Desk. Memuat ulang…'); setTimeout(function () { location.reload(); }, 900); } } catch (x) {} } });
  $('optTalk').checked = S.opt.talk; $('optFocus').checked = S.opt.focus; syncMute();
  boot();
}
