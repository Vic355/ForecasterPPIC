<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monitoring Produksi Harian · PPIC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<style>
/* Daily production monitoring page. Separate page on the same Cloudflare Worker as the main app (served at /produksi/). Placeholder for now. */
:root {
  --bg: #F4F5F7; --panel: #FFFFFF; --line: #D5D9DD; --fg: #1F2428; --muted: #5F6770;
  --accent: #4B2F96; --accent-soft: #EEEAF8; --ok: #1E6B34; --ok-soft: #E3F2E7;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #15171A; --panel: #1D2024; --line: #343940; --fg: #E6E8EB; --muted: #9AA2AB;
  --accent: #B7A5F0; --accent-soft: #2B2442; --ok: #7FD39A; --ok-soft: #1B3324; color-scheme: dark } }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 13px; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-left, 0px)) 32px; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
h1 { margin: 0; font-size: 20px; font-weight: 700; }
h1 span { font-weight: 400; font-size: 15px; color: var(--muted); }
a.back { color: var(--accent); font-weight: 600; text-decoration: none; padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
a.back:hover { background: var(--accent-soft); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); font-weight: 700; font-size: 12px; }
.muted { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Monitoring Produksi Harian <span>· PPIC Decision Support System</span></h1>
    <a class="back" href="/">← Kembali ke PPIC Forecast Desk</a>
  </header>
  <div class="card">
    <p><span class="badge">Halaman aktif</span></p>
    <p>Halaman monitoring produksi harian sudah tersambung ke situs yang sama. Fitur akan ditambahkan di sini.</p>
    <p class="muted">Hari ini: <b id="today">-</b></p>
  </div>
</div>
<script>
document.getElementById('today').textContent = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
</script>
</body>
</html>
