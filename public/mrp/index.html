<!DOCTYPE html>
<html lang="id" data-theme="sepia">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MRP Bahan Baku · PPIC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&family=Source+Sans+3:wght@400;600;700&family=Source+Code+Pro:wght@400;500&display=swap">
<style>
:root { --font: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "Source Code Pro", ui-monospace, Menlo, Consolas, monospace; --serif: Literata, Georgia, serif; --W: 34px; --RH: 34px; --LW: 150px; }
html[data-theme=sepia]{--bg:#efe9dc;--paper:#fcf8ef;--panel2:#f5efe2;--ink:#2b2a26;--mut:#6a665c;--line:#dcd3c0;--line2:#e9e2d2;--acc:#3f6b56;--acc2:#e3ece3;--bad:#b23a2a;--badbg:#f7e0d8;--warn:#865a00;--warnbg:#f8ecd0;--mid:#c48e1c;--ok:#2e7a4b;--okbg:#e0efe2;--blu:#2d5f9a;--blubg:#e4ebf3;--th:#f2ecdf;--grp:#f6f1e6;--hover:#f3eddf;--offb:#e6dfcf;--input:#fffdf7;--shadow:rgba(80,60,20,.12);--hot:#c8452f}
html[data-theme=light]{--bg:#eef0f2;--paper:#ffffff;--panel2:#f5f6f7;--ink:#1d222a;--mut:#5c6470;--line:#d5d9de;--line2:#e7e9ec;--acc:#1f6b5c;--acc2:#e1f0ec;--bad:#b3261e;--badbg:#fbe5e2;--warn:#8a5a00;--warnbg:#fdf0d6;--mid:#c88a12;--ok:#1e7a44;--okbg:#e1f3e8;--blu:#1f5fbf;--blubg:#e6eefb;--th:#f1f3f5;--grp:#f6f7f8;--hover:#f3f5f7;--offb:#e4e7ea;--input:#fff;--shadow:rgba(20,30,40,.10);--hot:#c8452f}
html[data-theme=dark]{--bg:#1b2026;--paper:#232a32;--panel2:#29303a;--ink:#e4dfd3;--mut:#a3aab4;--line:#38404b;--line2:#2d343e;--acc:#e3a55e;--acc2:#3d3223;--bad:#ff8272;--badbg:#3d201c;--warn:#f0b75a;--warnbg:#382c17;--mid:#e0a63a;--ok:#66d293;--okbg:#17322a;--blu:#86b4ff;--blubg:#1a2740;--th:#272e37;--grp:#262c34;--hover:#28303a;--offb:#161a1f;--input:#151a1f;--shadow:rgba(0,0,0,.35);--hot:#ff8a6a;color-scheme:dark}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.4; }
button, select, input, textarea { font: inherit; color: inherit; }
button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); cursor: pointer; font-weight: 600; min-height: 32px; }
button:hover { background: var(--hover); }
button.pri { background: var(--acc); border-color: var(--acc); color: #fff; }
html[data-theme=dark] button.pri { color: #1b1206; }
button.ghost { border-color: transparent; background: transparent; }
button.sm { min-height: 27px; padding: 2px 9px; font-size: 13px; }
button.link { border: 0; background: none; padding: 0; min-height: 0; color: var(--blu); text-decoration: underline; font-weight: 600; }
button:disabled { opacity: .5; cursor: default; }
select, input[type=text], input[type=number], input[type=search], input[type=date], textarea { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--input); min-height: 30px; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.mut { color: var(--mut); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0; }
.top { display: flex; align-items: center; gap: 14px; padding: 10px 18px; background: var(--paper); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 40; }
.brand { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
.brand h1 { font-size: 21px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 700; background: var(--th); color: var(--mut); white-space: nowrap; }
.chip.ok { background: var(--okbg); color: var(--ok); } .chip.warn { background: var(--warnbg); color: var(--warn); } .chip.bad { background: var(--badbg); color: var(--bad); } .chip.blu { background: var(--blubg); color: var(--blu); } .chip.acc { background: var(--acc2); color: var(--acc); }
.ask { flex: 1; max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; background: var(--input); color: var(--mut); cursor: text; }
.ask kbd { margin-left: auto; font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
.switch { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.switch a, .switch span { padding: 6px 12px; font-weight: 600; text-decoration: none; color: var(--mut); white-space: nowrap; }
.switch span { background: var(--acc2); color: var(--acc); }
.switch a:hover { background: var(--hover); }
.stepper { display: flex; background: var(--paper); border-bottom: 1px solid var(--line); padding: 0 12px; overflow-x: auto; }
.st { flex: 1; min-width: 170px; display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 0; border-radius: 10px 10px 0 0; background: none; text-align: left; font-weight: 400; min-height: 0; position: relative; }
.st + .st::before { content: ""; position: absolute; left: -14px; top: 50%; width: 22px; border-top: 1px solid var(--line); }
.st .n { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line); font-weight: 700; color: var(--mut); background: var(--paper); font-family: var(--serif); }
.st b { display: block; font-size: 15px; }
.st small { color: var(--mut); font-size: 12px; }
.st.on { background: var(--acc2); box-shadow: inset 0 -3px 0 var(--acc); }
.st.on .n { background: var(--acc); border-color: var(--acc); color: #fff; }
.st .bd { margin-left: auto; }
.demobar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 7px 20px; background: var(--warnbg); color: var(--warn); font-size: 13.5px; border-bottom: 1px solid var(--line); }
.demobar .sp { flex: 1; }
.btnlink { padding: 4px 10px; border: 1px solid currentColor; border-radius: 8px; color: inherit; text-decoration: none; font-weight: 600; }
.aibar { position: sticky; top: 55px; z-index: 35; display: flex; gap: 10px; align-items: center; padding: 8px 20px; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.speech { flex: 1; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; font-size: 13.5px; }
.eye { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid var(--acc); display: grid; place-items: center; background: var(--paper); }
.eye i { width: 10px; height: 10px; border-radius: 50%; background: var(--ink); display: block; }
.aipanel { position: fixed; z-index: 45; left: 16px; width: 400px; min-width: 300px; max-width: calc(100vw - 40px); max-height: calc(100vh - 140px); overflow: auto; resize: horizontal; background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 18px 40px var(--shadow); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.aipanel > * { flex: none; }
.stabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.stabs button.on { background: var(--acc2); border-color: var(--acc); color: var(--acc); }
.alert { border: 1px solid var(--line); border-left: 4px solid var(--c, var(--blu)); background: var(--paper); border-radius: 10px; padding: 9px 11px; }
.alert.red { --c: var(--bad); background: var(--badbg); } .alert.amb { --c: var(--mid); background: var(--warnbg); } .alert.grn { --c: var(--ok); }
.alert .k { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--c); }
.alert .t { font-weight: 700; margin: 2px 0; }
.alert .d { font-size: 13px; color: var(--mut); }
.alert .acts { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
.chat { display: flex; flex-direction: column; gap: 8px; }
.msg { padding: 8px 10px; border-radius: 10px; background: var(--paper); border: 1px solid var(--line); font-size: 13.5px; }
.msg.me { background: var(--acc2); border-color: transparent; align-self: flex-end; max-width: 90%; }
.msg ul { margin: 4px 0; padding-left: 18px; }
.sugg { display: flex; flex-wrap: wrap; gap: 6px; }
.sugg button { min-height: 26px; padding: 2px 9px; font-size: 12.5px; border-radius: 999px; }
main { padding: 16px 20px 60px; min-width: 0; }
.phead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.phead h2 { font-size: 22px; }
.phead .sp { flex: 1; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
.card h3 { font-size: 16px; margin-bottom: 6px; }
.card .hd { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
.card .hd h3 { margin: 0; }
.card .hd .sp { flex: 1; }
.howto { font-size: 13.5px; color: var(--mut); margin: 0 0 10px; }
.howto b { color: var(--ink); }
/* summary cards with preview graphics */
.kcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(205px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kc { --c: var(--blu); --cb: var(--blubg); display: flex; flex-direction: column; gap: 2px; text-align: left; font-weight: 400; padding: 11px 13px 9px; border: 1px solid color-mix(in srgb, var(--c) 35%, var(--line)); border-top: 4px solid var(--c); border-radius: 12px; background: var(--paper); box-shadow: 0 2px 6px var(--shadow); min-height: 0; }
.kc:hover { background: var(--paper); box-shadow: 0 6px 16px var(--shadow); transform: translateY(-1px); }
.kc.on { outline: 2px solid var(--c); outline-offset: 1px; }
.kc.red { --c: var(--bad); --cb: var(--badbg); } .kc.amb { --c: var(--mid); --cb: var(--warnbg); } .kc.grn { --c: var(--ok); --cb: var(--okbg); } .kc.blu { --c: var(--blu); --cb: var(--blubg); } .kc.gry { --c: var(--mut); --cb: var(--th); }
.kc .lb { display: flex; justify-content: space-between; gap: 6px; align-items: center; font-size: 12.5px; font-weight: 700; color: var(--mut); }
.kc .pl { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--cb); color: var(--c); white-space: nowrap; }
.kc .v { font-family: var(--serif); font-size: 26px; font-weight: 600; color: var(--c); line-height: 1.15; }
.kc .s { font-size: 12.5px; color: var(--mut); }
.kc svg { display: block; width: 100%; height: 38px; margin-top: 4px; }
/* tables */
.tbox { overflow: auto; border: 1px solid var(--line2); border-radius: 10px; max-height: 64vh; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 5px 9px; border-bottom: 1px solid var(--line2); text-align: left; white-space: nowrap; background: var(--paper); vertical-align: middle; }
th { background: var(--th); font-size: 12.5px; color: var(--mut); font-weight: 700; position: sticky; top: 0; z-index: 2; }
th.num, td.num { text-align: right; }
th.grp { text-align: center; border-left: 2px solid var(--line); }
td.sep, th.sep { border-left: 2px solid var(--line); }
tr.cat td { background: var(--grp); font-weight: 700; }
tr.mat td { background: var(--panel2); font-weight: 600; }
tr.mat td:first-child { cursor: pointer; }
tr.sku td:first-child { padding-left: 34px; }
tr.tot td { font-weight: 700; background: var(--th); }
td.dim, span.dim { color: var(--mut); }
.dummy { color: var(--mut); font-style: italic; }
td.bad { background: var(--badbg); color: var(--bad); font-weight: 700; }
td.low { background: var(--warnbg); color: var(--warn); font-weight: 700; }
td.ord { background: var(--acc2); color: var(--acc); font-weight: 700; }
td.rcv { color: var(--ok); font-weight: 700; }
input.cell { width: 86px; text-align: right; padding: 3px 6px; min-height: 28px; font-variant-numeric: tabular-nums; }
input.cell.w { width: 210px; text-align: left; }
input.cell.m { width: 130px; text-align: left; }
input.cell.set { border-color: var(--mid); background: var(--warnbg); font-weight: 700; }
select.cell { min-height: 28px; padding: 2px 6px; }
.exp { border: 0; background: none; padding: 0 6px 0 0; min-height: 0; font-weight: 700; color: var(--mut); }
.toolbar { display: flex; gap: 8px 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.toolbar label { display: flex; gap: 6px; align-items: center; color: var(--mut); }
.toolbar .sp { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; border-right: 1px solid var(--line); background: var(--paper); min-height: 30px; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--acc); color: #fff; }
html[data-theme=dark] .seg button.on { color: #1b1206; }
/* material MRP cards */
.mlist { display: flex; flex-direction: column; gap: 10px; }
.mc { background: var(--paper); border: 1px solid var(--line); border-left: 5px solid var(--c, var(--ok)); border-radius: 12px; }
.mc.red { --c: var(--bad); } .mc.amb { --c: var(--mid); } .mc.blu { --c: var(--blu); } .mc.grn { --c: var(--ok); }
.mc .row { display: grid; grid-template-columns: minmax(220px, 1.3fr) minmax(220px, 1.2fr) minmax(300px, 2fr) auto; gap: 14px; align-items: center; padding: 10px 14px; cursor: pointer; }
.mc .nm b { display: block; font-size: 15px; }
.mc .nm small { color: var(--mut); }
.mc .facts { display: grid; grid-template-columns: auto auto; gap: 1px 12px; font-size: 13px; }
.mc .facts span { color: var(--mut); }
.mc .facts b { text-align: right; font-variant-numeric: tabular-nums; }
.mc svg.spark { width: 100%; height: 62px; display: block; }
.mc .det { padding: 4px 14px 14px; border-top: 1px solid var(--line2); }
.mc .why { font-size: 13.5px; margin: 8px 0; }
.mc .why li { margin: 2px 0; }
svg .bufl { stroke: var(--mid); stroke-dasharray: 4 3; stroke-width: 1.4; fill: none; }
svg .zero { stroke: var(--bad); stroke-width: 1; opacity: .5; }
svg .oh { stroke: var(--acc); stroke-width: 2; fill: none; }
svg .ohA { fill: color-mix(in srgb, var(--acc) 14%, transparent); }
svg .neg { fill: color-mix(in srgb, var(--bad) 30%, transparent); }
svg .rel { fill: var(--bad); } svg .arr { fill: var(--ok); } svg .po { fill: var(--blu); }
svg text { font-size: 10px; fill: var(--mut); font-family: var(--font); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--mut); margin: 6px 0; }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px; background: var(--acc); }
.legend i.b { background: none; border-top: 2px dashed var(--mid); height: 0; }
.legend i.r { width: 8px; height: 8px; background: var(--bad); transform: rotate(45deg); }
.legend i.g { width: 8px; height: 8px; background: var(--ok); border-radius: 50%; }
.legend i.p { width: 8px; height: 8px; background: var(--blu); border-radius: 50%; }
.pop { position: fixed; z-index: 80; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 14px 30px var(--shadow); padding: 12px 14px; width: 330px; top: 56px; right: 16px; }
.pop label { display: flex; gap: 9px; align-items: flex-start; padding: 6px 0; }
.menu { position: fixed; z-index: 85; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 14px 30px var(--shadow); padding: 6px; display: flex; flex-direction: column; min-width: 260px; }
.menu button { text-align: left; border: 0; font-weight: 600; }
.menu button small { display: block; font-weight: 400; color: var(--mut); }
#toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 10px; z-index: 95; font-size: 13.5px; max-width: 90vw; }
.nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 30% { box-shadow: 0 0 0 3px var(--mid); } 100% { box-shadow: none; } }
@media (max-width: 1100px) { .mc .row { grid-template-columns: 1fr 1fr; } }
@media (max-width: 900px) { .top { flex-wrap: wrap; } .ask { display: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>MRP Bahan Baku</h1><span class="mut" id="brandSub"></span></div>
  <div class="ask" id="askBar" role="button" tabindex="0"><span class="eye"><i></i></span><span>Tanya asisten tentang bahan baku…</span><kbd>Ctrl K</kbd></div>
  <div class="switch"><a href="/" title="Kembali ke Forecast Desk (Saran buffer, Rencana produksi)">Forecast Desk</a><a href="/produksi/">Produksi</a><span>MRP</span></div>
  <button id="expBtn">⇩ Ekspor</button>
  <button id="setBtn" title="Pengaturan">⚙</button>
</header>
<nav class="stepper" id="stepper"></nav>
<div class="demobar" id="demoBar" hidden><b>Data contoh.</b> <span id="demoTxt"></span><span class="sp"></span><a href="/" class="btnlink">Buka Saran buffer di Forecast Desk</a></div>
<div class="aibar" id="aibar">
  <span class="eye" title="Asisten"><i></i></span>
  <div class="speech" id="speech"></div>
  <button id="aiAlerts">Alerts <span class="chip bad" id="aiN">0</span></button>
  <button id="aiAsk">Tanya</button>
</div>
<div class="aipanel" id="aipanel" hidden>
  <div style="display:flex;align-items:center;gap:8px"><b style="font-family:var(--serif);font-size:16px">Asisten</b><span class="mut" style="font-size:12.5px">MRP bahan baku</span><span style="flex:1"></span><button class="ghost sm" id="aiClose">✕</button></div>
  <div class="stabs"><button class="on" data-st="alerts">Alerts <span class="chip bad" id="alertN">0</span></button><button data-st="tanya">Tanya</button></div>
  <div id="alertsBox" style="display:flex;flex-direction:column;gap:8px"></div>
  <div id="tanyaBox" class="chat" hidden>
    <div class="sugg" id="sugg"></div>
    <div id="chatLog" class="chat"></div>
    <form id="chatForm" style="display:flex;gap:6px"><input type="text" id="chatIn" placeholder="mis. kenapa JR-V2? · buffer KRT-5P = 20000" style="flex:1"><button class="pri">Kirim</button></form>
  </div>
</div>
<main id="main"></main>
<div class="pop" id="setPop" hidden>
  <b style="font-family:var(--serif)">Pengaturan</b>
  <label><input type="checkbox" id="optDummy"><span>Pakai BOM contoh untuk SKU tanpa BOM<small style="display:block;color:var(--mut)">Karton 1 pcs, jumbo roll ≈ berat bersih × 1,04, plastik ≈ berat bersih × 3,5% per karton. Matikan bila BOM sudah lengkap di Material master.</small></span></label>
  <label><input type="checkbox" id="optSched"><span>Kebutuhan bulan pertama ikut jadwal harian<small style="display:block;color:var(--mut)">Bila Perencanaan Produksi punya rencana bulan itu, kebutuhan per hari mengikuti target harian per SKU. Selain itu dibagi rata Senin–Sabtu.</small></span></label>
  <label style="padding-left:24px">Tema <select id="optTheme"><option value="sepia">Sepia</option><option value="light">Terang</option><option value="dark">Gelap</option></select></label>
  <div style="display:flex;gap:6px;justify-content:space-between"><button id="resetRm" class="sm">Kembalikan bahan baku contoh</button><button id="popClose">Tutup</button></div>
</div>
<div class="menu" id="menu" hidden></div>
<input type="file" id="impFile" accept=".xlsx,.xls" hidden>
<div id="toast" hidden></div>
<script>
// MRP Bahan Baku: raw material requirements from the Forecast Desk projection (PP M+1..M+3 × BOM per karton).
// Rule for raw materials: the BUFFER is the reorder point. When stok + PO terbuka (+ rencana pesan) falls to the buffer,
// an order is released; it arrives after the lead time. Buffer saran = kebutuhan rata-rata per hari × (lead time + hari cadangan).
// Data in: localStorage 'ppic_mrp' (sent by Forecast Desk → Saran buffer → Proyeksi buffer per bulan → Buka MRP bahan baku).
// Raw material master, open POs and settings: localStorage 'ppic_mrp_rm'. Daily schedule (optional): 'ppic_prod'.
var LS_IN = 'ppic_mrp', LS_RM = 'ppic_mrp_rm';
(function () {
  var inp = null; try { inp = JSON.parse(localStorage.getItem(LS_IN) || 'null'); } catch (e) {}
  var demo = /[?&]contoh\b/.test(location.search) || !(inp && inp.skus && inp.skus.length && inp.months && inp.months.length);
  if (!demo) { main(inp, false, null); return; }
  fetch('/produksi/contoh-rencana-2026-11.json').then(function (r) { return r.json(); }).then(function (p) { main(demoInput(p), true, p); })
    .catch(function (e) { document.getElementById('main').innerHTML = '<div class="card">Gagal memuat data contoh: ' + e + '</div>'; });
})();

        add('kebutuhan_sku', pg);
      }
      XLSX.writeFile(wb, kind === 'tpl' ? 'Template_bahan_baku_PO.xlsx' : 'MRP_bahan_baku_' + C.t0 + '.xlsx');
    }).catch(function (e) { toast('Ekspor gagal: ' + e.message); });
  }
  function importX(file) {
    withXlsx().then(function () { return file.arrayBuffer(); }).then(function (buf) {
      var wb = XLSX.read(buf, { type: 'array', cellDates: true }), ms = wb.Sheets.bahan_baku, ps = wb.Sheets.po_terbuka, n1 = 0, n2 = 0;
      if (!ms && !ps) { toast('Lembar bahan_baku / po_terbuka tidak ada. Pakai Template.'); return; }
      if (ms) { var rows = XLSX.utils.sheet_to_json(ms, { defval: '' }), list = []; rows.forEach(function (r) { if (!String(r.kode || '').trim()) return; var m = { buf: null, soh: null }; MCOL.forEach(function (c) { var v = r[c[0]]; m[c[1]] = ['code', 'name', 'cat', 'kw'].indexOf(c[1]) >= 0 ? String(v).trim() : num(v); }); if (!CAT[m.cat]) m.cat = /karton|ct/i.test(m.cat) ? 'ct' : /jumbo|jr/i.test(m.cat) ? 'jr' : 'pl'; list.push(m); }); if (list.length) { R.mats = list; n1 = list.length; } }
      if (ps) { var rp = XLSX.utils.sheet_to_json(ps, { defval: '' }); R.po = rp.filter(function (r) { return String(r.kode || '').trim(); }).map(function (r) { var e = r.eta instanceof Date ? iso(r.eta) : String(r.eta || '').trim().slice(0, 10); return { no: String(r.no_po || ''), code: String(r.kode).trim(), qty: num(r.qty), eta: e }; }); n2 = R.po.length; }
      R.demoStock = false; save(); render(); toast('Diimpor: ' + n1 + ' bahan baku, ' + n2 + ' PO.');
    }).catch(function (e) { toast('Impor gagal: ' + e.message); });
  }

  /* ---------------- start ---------------- */
  try { var th = (JSON.parse(localStorage.getItem('ppic_ui') || '{}') || {}).theme; if (th) { document.documentElement.dataset.theme = th; $('optTheme').value = th; } } catch (x) {}
  $('optDummy').checked = R.opt.dummy !== false; $('optSched').checked = R.opt.sched !== false;
  seedDemoStock(); render(); side('alerts');
}
