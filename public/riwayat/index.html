<style>
:root { --font: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif; --serif: Literata, Georgia, serif; }
html[data-theme=sepia]{--bg:#efe9dc;--paper:#fcf8ef;--ink:#2b2a26;--mut:#6a665c;--line:#dcd3c0;--line2:#e9e2d2;--acc:#3f6b56;--acc2:#e3ece3;--blu:#2d5f9a;--hover:#f1ead9}
html[data-theme=light]{--bg:#eef0f2;--paper:#ffffff;--ink:#1d222a;--mut:#5c6470;--line:#d5d9de;--line2:#e7e9ec;--acc:#1f6b5c;--acc2:#e1f0ec;--blu:#1f5fbf;--hover:#f1f3f5}
html[data-theme=dark]{--bg:#1b2026;--paper:#232a32;--ink:#e4dfd3;--mut:#a3aab4;--line:#38404b;--line2:#2d343e;--acc:#e3a55e;--acc2:#3d3223;--blu:#86b4ff;--hover:#2d353f}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0; }
.top { display: flex; align-items: center; gap: 14px; padding: 10px 18px; background: var(--paper); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
.top h1 { font-size: 21px; }
.switch { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-left: auto; }
.switch a, .switch span { padding: 6px 12px; font-weight: 600; text-decoration: none; color: var(--mut); white-space: nowrap; }
.switch span { background: var(--acc2); color: var(--acc); }
.switch a:hover { background: var(--hover); }
main { max-width: 860px; margin: 0 auto; padding: 22px 18px 60px; }
.lead { color: var(--mut); margin: 0 0 18px; }
.ctl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.ctl input { flex: 1; min-width: 220px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); font: inherit; }
.ctl button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
.ctl button.on { background: var(--acc2); color: var(--acc); border-color: var(--acc); }
.day { margin: 22px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--mut); font-family: var(--font); font-weight: 700; }
.rel { background: var(--paper); border: 1px solid var(--line2); border-radius: 12px; padding: 12px 16px; margin-bottom: 10px; }
.rel h3 { font-size: 17px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.rel h3 .v { font-family: var(--font); font-size: 12px; font-weight: 700; color: var(--acc); background: var(--acc2); border-radius: 999px; padding: 1px 9px; }
.rel h3 .cur { font-family: var(--font); font-size: 12px; font-weight: 700; color: #fff; background: var(--acc); border-radius: 999px; padding: 1px 9px; }
html[data-theme=dark] .rel h3 .cur { color: #1b1206; }
.rel h3 a { font-family: var(--font); font-size: 12.5px; font-weight: 600; color: var(--blu); }
.rel .tags { display: flex; gap: 5px; flex-wrap: wrap; margin: 4px 0 2px; }
.rel .tags span { font-size: 11.5px; font-weight: 700; color: var(--mut); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }
.rel ul { margin: 6px 0 0; padding-left: 20px; }
.rel li { margin: 3px 0; }
.empty { color: var(--mut); }
</style>
</head>

var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
function dl(d) { var p = d.split('-'); return +p[2] + ' ' + MON[+p[1] - 1] + ' ' + p[0]; }
function txt(h) { var e = document.createElement('div'); e.innerHTML = h; return e.textContent.toLowerCase(); }
var area = '';
function draw() {
  var q = document.getElementById('q').value.trim().toLowerCase(), last = '', h = '';
  R.forEach(function (r, i) {
    if (area && r.a.indexOf(area) < 0) return;
    if (q && q.split(/\s+/).some(function (w) { return txt(r.t + ' ' + r.p.join(' ')).indexOf(w) < 0; })) return;
    if (r.d !== last) { h += '<h2 class="day">' + dl(r.d) + '</h2>'; last = r.d; }
    h += '<article class="rel"><h3>' + (r.v ? '<span class="v">v' + r.v + '</span>' : '') + (i === 0 ? '<span class="cur">versi saat ini</span>' : '') + r.t + (r.v ? ' <a href="' + REPO + r.v + '" target="_blank" rel="noopener">PR #' + r.v + ' ↗</a>' : '') + '</h3>' +
      '<div class="tags">' + r.a.map(function (a) { return '<span>' + a + '</span>'; }).join('') + '</div><ul>' + r.p.map(function (p) { return '<li>' + p + '</li>'; }).join('') + '</ul></article>';
  });
  document.getElementById('list').innerHTML = h || '<p class="empty">Tidak ada perubahan yang cocok.</p>';
}
document.getElementById('tags').innerHTML = ['', 'Forecast Desk', 'Produksi', 'MRP'].map(function (a) { return '<button type="button" data-a="' + a + '" class="' + (a === area ? 'on' : '') + '">' + (a || 'Semua') + '</button>'; }).join(' ');
document.getElementById('tags').addEventListener('click', function (e) { var b = e.target.closest('[data-a]'); if (!b) return; area = b.getAttribute('data-a'); this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); }); draw(); });
document.getElementById('q').addEventListener('input', draw);
try { var th = (JSON.parse(localStorage.getItem('ppic_ui') || '{}') || {}).theme; if (th) document.documentElement.setAttribute('data-theme', th); } catch (e) {}
draw();
</script>
